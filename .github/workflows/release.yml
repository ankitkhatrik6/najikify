name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ---------------------------------------------------------------- Linux ---
  linux:
    name: Linux (.deb + bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debian package
        run: bash packaging/linux/build_deb.sh

      - name: Build portable tarball
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          tar -czf "build/najikify-linux-${VERSION}-amd64.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Show artifacts
        run: ls -lh build/*.deb build/*.tar.gz

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: najikify-linux
          path: |
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Android ---
  android:
    name: Android (APK)
    runs-on: ubuntu-latest

    env:
      # Release signing material, supplied by repository secrets.
      # See docs/RELEASE_SIGNING.md for how these are generated.
      #
      # NOTE: RELEASE_KEYSTORE_FILE is deliberately NOT set here — the `runner`
      # context is not available in a job-level `env` block, and referencing it
      # makes the whole workflow fail to start. It is exported to $GITHUB_ENV by
      # the "Materialize release keystore" step instead.
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize release keystore
        # Google Play Protect blocks APKs signed with the shared Android debug
        # key ("App blocked to protect your device — Play Protect hasn't seen an
        # app from this developer before"). Signing with a dedicated release key
        # fixes that; the key never touches the repository, it is injected here
        # from the RELEASE_KEYSTORE_BASE64 secret.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          # $RUNNER_TEMP is the shell variable for the runner temp dir; the
          # `runner.temp` context is not usable in job-level env.
          KEYSTORE_PATH="$RUNNER_TEMP/najikify-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release keystore written to $KEYSTORE_PATH"
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" | grep -E 'Alias name|Valid from|SHA256'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-36" > /dev/null

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK is signed with the release key
        # Guard against silently shipping a debug-signed APK (which Play
        # Protect blocks) if the signing configuration ever regresses.
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -qi 'CN=Android Debug' /tmp/apk-certs.txt; then
            echo "::error::APK is signed with the Android debug key — Play Protect will block it."
            exit 1
          fi

      - name: Name artifact with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/najikify-android-${VERSION}.apk"

      - name: Show artifacts
        run: ls -lh build/*.apk

      - name: Remove signing material
        if: always()
        run: rm -f "$RELEASE_KEYSTORE_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: najikify-android
          path: build/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------- Release ---
  release:
    name: Publish release
    needs: [ linux, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: false
          draft: false
          body: |
            ## Najikify ${{ github.ref_name }}

            Private peer-to-peer file transfer for your local network — no cloud, no accounts.

            ### Downloads

            | File | Platform |
            |------|----------|
            | `najikify-linux-*-amd64.deb` | Debian/Ubuntu (x86-64) — install with `sudo apt install ./najikify-linux-*.deb` |
            | `najikify-linux-*-amd64.tar.gz` | Portable Linux bundle (no install) |
            | `najikify-android-*.apk` | Android — sideload to install |

            ### Setup

            1. Install on both devices and open **Najikify** on each.
            2. Both must be on the same Wi-Fi / LAN (allow `53317/tcp` + `53318/udp` through the firewall).
            3. The other device appears under **Devices** within seconds — tap it, pick files, Accept on the receiver.

            **Full Changelog**: https://github.com/ankitkhatrik6/najikify/commits/${{ github.ref_name }}
